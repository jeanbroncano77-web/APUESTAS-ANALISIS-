name: SportsAI 24/7 Daily Autonomous Predictions & Telegram Dispatch

on:
  schedule:
    # 00:30 UTC = 19:30 (7:30 PM) hora de Lima/Bogota (UTC-5)
    - cron: '30 0 * * *'
    # Respaldo 00:35 UTC por si GitHub Actions tiene cola de espera
    - cron: '35 0 * * *'
  workflow_dispatch: # Permite ejecutar manualmente con un clic en GitHub Actions

permissions:
  contents: write

jobs:
  run-sportsai:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout del Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy

      - name: 4. Ejecutar Simulación de Partidos de Mañana y Despacho a Telegram
        run: |
          python sports_agents/run_daily_cloud.py

      - name: 5. Guardar y Publicar en GitHub Pages
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "SportsAI Autonomous Bot"
          git add index.html dashboard_pronosticos.html sports_agents/simulations_tomorrow_results.json
          git commit -m "chore(auto): Actualización diaria de partidos de mañana y dashboard [skip ci]" || echo "Sin cambios para commitear"
          git push origin main
