name: SportsAI 24/7 Daily Autonomous Predictions & Telegram Dispatch

on:
  push:
    branches:
      - main
    paths:
      - 'sports_agents/official_calendar.json'
      - 'sports_agents/teams_database.json'
      - 'sports_agents/matches_database.json'
      - 'trigger_run.txt'
  schedule:
    # --- VENTANA NOCTURNA (7:30 PM / 19:30 Lima = 00:30 UTC) ---
    - cron: '25 0 * * *'
    - cron: '30 0 * * *'
    - cron: '40 0 * * *'
    - cron: '50 0 * * *'
    - cron: '10 1 * * *'
    # --- VENTANA MATUTINA (7:30 AM Lima = 12:30 UTC) ---
    - cron: '25 12 * * *'
    - cron: '30 12 * * *'
    - cron: '40 12 * * *'
  workflow_dispatch: # Permite disparar manualmente con 1 clic desde GitHub
  repository_dispatch: # Permite disparar vía webhook externo gratuito a las 19:30 exactas
    types: [daily-trigger]

permissions:
  contents: write

jobs:
  run-sportsai:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout del Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy

      - name: 4. Ejecutar Simulación de Partidos de Mañana y Despacho a Telegram
        run: |
          python sports_agents/run_daily_cloud.py

      - name: 5. Guardar y Publicar en GitHub Pages
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "SportsAI Autonomous Bot"
          git add index.html dashboard_pronosticos.html sports_agents/simulations_tomorrow_results.json sports_agents/autonomous_feedback_log.json sports_agents/dispatch_tracker.json
          git commit -m "chore(auto): Actualización diaria de partidos de mañana y dashboard [skip ci]" || echo "Sin cambios para commitear"
          git push origin main
